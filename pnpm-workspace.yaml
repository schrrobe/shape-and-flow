packages:
  - 'booking-app/apps/*'
  - 'booking-app/packages/*'

# pnpm 10 does not run dependency build scripts unless they are listed here.
# Every entry is a package whose postinstall is genuinely required, with the
# reason recorded, so the list stays auditable rather than growing by default.
onlyBuiltDependencies:
  # Native module resolver used by eslint-plugin-import-x; without its
  # prebuilt binary, import-x/order cannot classify external vs internal.
  - unrs-resolver
