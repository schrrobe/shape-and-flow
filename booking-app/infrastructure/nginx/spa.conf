# The entire nginx.conf of the web container — not a `conf.d` snippet.
#
# It replaces the stock file because that one sets `user nginx;` and
# `pid /var/run/nginx.pid;`, and neither works for a process that is already unprivileged.
# Everything nginx writes is moved under /tmp for the same reason.
#
# This server does one job: hand out the built bundle. It never proxies. `/api` is routed
# to the API container by the edge proxy (booking.conf in this directory), so the API sees
# exactly one proxy hop, which is what `app.set('trust proxy', 1)` in the API assumes.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable by uid 101. Without these nginx fails at start-up rather than at the first
  # request large enough to spill to disk, which is the better of the two failures but
  # still not one anybody should meet.
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # One line per request on stdout, which is where the container runtime collects it.
  # The request id comes from the edge proxy, so a static asset and the API call the same
  # page made can be joined.
  log_format sf '$remote_addr $request_id "$request" $status $body_bytes_sent $request_time';
  access_log /dev/stdout sf;

  sendfile on;
  tcp_nopush on;
  # The bundle is a handful of files; nothing here benefits from a long idle keepalive and
  # a shorter one frees the connection sooner behind the edge proxy.
  keepalive_timeout 30s;
  # Never advertise the version. It tells an attacker which CVEs to try and tells a
  # legitimate visitor nothing.
  server_tokens off;

  gzip on;
  # Serves a `.gz` built at image build time, where compression could afford `-9`. `gzip on`
  # above is the fallback for anything that was not pre-compressed.
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Cache policy as a lookup rather than as `add_header` inside each location.
  #
  # nginx's `add_header` is inherited only when the current level declares none of its own,
  # so a single `Cache-Control` in a location would silently drop every security header set
  # at server level. Computing the value here keeps all headers in one place, where it is
  # visible that they apply to every response.
  #
  # Everything under /assets/ carries a content hash in its name, so it is immutable by
  # construction. Everything else — index.html above all — must be revalidated, or a deploy
  # would leave browsers running the previous bundle against the new API.
  map $uri $sf_cache_control {
    default        "no-store";
    ~^/assets/     "public, max-age=31536000, immutable";
  }

  # Stripe's Connect embedded components are the one place the bundle loads third-party
  # code, and /office/payments is the only page that mounts them.
  #
  # The relaxations they need are nonetheless set on *every* response, not looked up per
  # request URI, because a per-route policy cannot work here and would be worse than
  # useless if it appeared to. The bundle is a single `index.html` with client-side
  # routing: CSP and Cross-Origin-Opener-Policy are properties of a *document*, fixed when
  # it is fetched and in force until the next full load. A visitor who reaches
  # /office/payments through the office sidebar is still running the document served for
  # whatever page they hard-loaded, so a route-scoped relaxation would never reach the one
  # page that needs it — while a hard load of /office/payments would hand the relaxed
  # policy to every screen they visit afterwards anyway. `$request_uri` is also unnormalised,
  # so a prefix match on it grants the relaxation to /office/payments/../users as well.
  #
  # So the trade is stated rather than hidden: the whole app carries the wider policy for
  # as long as the office and the public booking flow share one document. Scoping it for
  # real needs the office area served as its own HTML entry, which is a build change rather
  # than a header change.
  #
  # The relaxations Stripe documents as required:
  #   script-src/frame-src  connect-js.stripe.com and js.stripe.com — the loader and the
  #                         iframes it opens
  #   img-src               *.stripe.com — card brands, avatars and receipt thumbnails
  #   connect-src           api.stripe.com — the components talk to Stripe directly

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle loads nothing it did not ship with: no CDN, no web font, no analytics —
    # with one exception, Stripe, whose Connect components are third-party by construction.
    # Saying so in a header is what turns that from a fact about today's code into a
    # property the browser enforces.
    #
    # `style-src 'unsafe-inline'` is unavoidable: Vue writes inline `style` attributes for
    # transitions and computed layout, and the attribute form is covered by this directive.
    # Scripts have no such exemption. It also happens to satisfy the inline style element
    # Stripe's components emit, which would otherwise need its hash listed here.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https://*.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://connect-js.stripe.com https://js.stripe.com; frame-src https://connect-js.stripe.com https://js.stripe.com; connect-src 'self' https://api.stripe.com; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # `same-origin` severs the opener reference of the popup Stripe opens to authenticate
    # the account holder, so that flow hangs with no error. Stripe documents `unsafe-none`
    # as the required value; see the note above the header block for why it cannot be
    # confined to the route that needs it.
    add_header Cross-Origin-Opener-Policy unsafe-none always;
    add_header Cache-Control $sf_cache_control always;

    # The booking management link puts its token in the URL *fragment*, which never reaches
    # a server or a Referer header. `no-referrer` above is the belt to that braces.

    location / {
      # The SPA owns its routing: /office/calendar is a real destination in the browser and
      # a 404 on disk. Falling back to index.html is what makes a reload of a deep link
      # work. A POST that lands here still ends in 405 — nginx refuses write methods on a
      # static file — so the fallback cannot turn a mistyped API call into a 200.
      try_files $uri $uri/ /index.html;
    }

    # Never serve a directory index, and never serve a dotfile that ended up in the bundle.
    location ~ /\. {
      return 404;
    }
  }
}
