# The edge vhost: the only thing on the machine that listens on the public internet.
#
# It belongs to the **host's** nginx, not to a container:
#
#     sudo cp booking-app/infrastructure/nginx/booking.conf /etc/nginx/sites-available/
#     sudo ln -s /etc/nginx/sites-available/booking.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Replace `buchung.example.com` with the real hostname; nothing else needs editing.
#
# ── Why the API is reached directly ─────────────────────────────────────────
#
# `/api` goes straight to the API container. It does **not** go through the web
# container, even though that container also runs nginx. The API calls
# `app.set('trust proxy', 1)`, which means "exactly one proxy added the last entry of
# X-Forwarded-For". Routing API traffic through a second nginx would make that last
# entry the web container's address, so every rate limit would be shared by the whole
# internet and every audit row would record the same IP. One hop, by construction.
#
# ── Ports ───────────────────────────────────────────────────────────────────
#
# Both upstreams are published on the loopback interface only (see
# docker-compose.prod.yml), so the containers are unreachable from outside this machine
# even if the firewall is misconfigured. This file is the only way in.

upstream sf_booking_api {
  server 127.0.0.1:3001;
  # A pool of idle connections, so a burst of bookings does not pay for a TCP handshake
  # per request. Requires the HTTP/1.1 and empty-Connection headers set below.
  keepalive 16;
}

upstream sf_booking_web {
  server 127.0.0.1:8080;
  keepalive 8;
}

# Honour an inbound request id, generate one when there is none.
#
# Accepting the client's id buys a trace that starts at whatever sent the request — a load
# balancer, a monitoring probe, or a support engineer with curl.
#
# The pattern is the API's own rule, restated: 1 to 128 printable ASCII characters, anything
# else replaced with a generated id. It has to match, because this file also *reports* the id
# in the response, and an id nginx accepted but the API truncated would leave the customer
# holding a reference that appears in no log line.
map $http_x_request_id $sf_request_id {
  default                    $request_id;
  "~^[[:print:]]{1,128}$"    $http_x_request_id;
}

server {
  listen 80;
  listen [::]:80;
  server_name buchung.example.com;

  # Certbot writes its challenge here and must be answerable over plain HTTP, so this
  # location has to come before the redirect.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  # HTTP/2 is requested as a `listen` parameter rather than with the `http2` directive,
  # because the deployment target is Ubuntu 24.04, whose nginx is 1.24; the standalone
  # directive arrived in 1.25.1 and 1.24 rejects it outright with
  # `unknown directive "http2"`, so nginx refuses to start at all.
  #
  # Two consequences worth knowing. On nginx 1.25 and newer this spelling is deprecated
  # and logs a warning, though it still works — switch to `http2 on;` if the server is
  # ever moved to a newer nginx. And http2 is a per-socket protocol option, not a
  # per-server one: if a second site on this machine also listens on :443, only one of
  # them may carry the parameter, or nginx warns `protocol options redefined`.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name buchung.example.com;

  # Issued by certbot; see docs/operations.md for the initial issuance.
  ssl_certificate     /etc/letsencrypt/live/buchung.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buchung.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # OCSP stapling is deliberately absent. Let's Encrypt no longer publishes an OCSP
  # responder URL in the certificates it issues, so `ssl_stapling on` has nothing to
  # staple: nginx accepts it and then warns on every reload that it is being ignored,
  # which trains the operator to skip reading reload output. Nothing is lost by
  # omitting it — there is no revocation endpoint to point clients at either way.

  # TLS is not optional here: the office session cookie is issued with `Secure` whenever
  # NODE_ENV is production, so a browser on plain HTTP would discard it and every login
  # would appear to succeed and then fail. HSTS makes the second visit impossible to
  # downgrade at all.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  server_tokens off;

  # The API accepts JSON and nothing else — no uploads, no attachments. A megabyte is
  # already generous for the largest booking payload and stops a body large enough to
  # matter before it reaches Node.
  client_max_body_size 1m;
  client_body_timeout 15s;

  access_log /var/log/nginx/booking.access.log;
  error_log  /var/log/nginx/booking.error.log warn;

  # ── API ───────────────────────────────────────────────────────────────────

  location /api/ {
    proxy_pass http://sf_booking_api;

    proxy_http_version 1.1;
    # Required for upstream keepalive: without it nginx forwards `Connection: close`.
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $sf_request_id;

    # Echo the id back even when the upstream fails before it can, so a 502 is still
    # traceable to the line in the API log that never arrived.
    #
    # The API echoes it too, and two identical `X-Request-Id` headers on one response is
    # the kind of small wrongness that costs somebody an afternoon. Hiding the upstream's
    # copy leaves exactly one, on every response including the ones the API never saw.
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $sf_request_id always;

    # nginx inherits `add_header` from the enclosing level only while the current level
    # declares none of its own. The line above declares one, which drops the server-level
    # HSTS header from every response under /api/ — so it has to be repeated. Same
    # inheritance rule spa.conf works around with a map.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Do not turn this off ─────────────────────────────────────────────────
    #
    # `proxy_request_buffering` is on by default and must stay that way. Stripe signs the
    # exact bytes of the webhook body, and the API verifies that signature against the
    # raw buffer Express captured. Streaming the body upstream unbuffered re-frames it as
    # chunked, and any module that rewrites, re-encodes or merely re-chunks it produces a
    # signature mismatch that looks exactly like an attack: every webhook rejected, every
    # paid booking left unconfirmed. Nothing in this location may modify a request body.
    proxy_request_buffering on;

    # Long enough for a Stripe API call made inside a request, short enough that a stuck
    # upstream is reported rather than held open until the client gives up.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # A retry on a non-idempotent POST is how one payment becomes two. The API has its own
    # idempotency keys, but they exist for the client's retries, not for silent ones the
    # operator never sees.
    proxy_next_upstream off;
  }

  # ── Everything else: the built bundle ─────────────────────────────────────

  location / {
    proxy_pass http://sf_booking_web;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $sf_request_id;

    # The web container sets Cache-Control, CSP and the rest per response. They are not
    # repeated here: two places deciding the same header is how they drift.
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # No `limit_req` zone on /api.
  #
  # The API rate-limits per route through Redis, with the limits the domain actually
  # needs, and it knows which callers are exempt. A second limiter here would be blind to
  # all of that — and the first thing it would throttle is Stripe retrying a webhook,
  # which is the one caller that must never be turned away.
}
