# The catch-all: what answers a hostname no vhost on this machine claims.
#
#     sudo rm -f /etc/nginx/sites-enabled/default        # Ubuntu ships its own, remove it first
#     sudo cp booking-app/infrastructure/nginx/default-server.conf /etc/nginx/sites-available/
#     sudo ln -s /etc/nginx/sites-available/default-server.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# ── Why this file exists ────────────────────────────────────────────────────
#
# Without a `default_server`, nginx serves an unmatched hostname from the *first* vhost
# it parsed — which on this machine is the booking app. Anybody who pointed a domain of
# theirs at this server's IP would get a working booking front end, and the API would see
# their hostname in the `Host` header.
#
# That is not immediately a tenant leak: `TenantResolutionMiddleware` refuses to let an
# unregistered hostname pick a tenant with `?organizer=`, and an unregistered hostname
# with no slug falls through to the deployment's default organizer. But it does mean a
# stranger's domain serving our customers' booking flow, with our certificate errors and
# our support address. Ending the connection is the honest answer.
#
# 444 is nginx's own non-status: close the connection, write nothing. A stranger probing
# hostnames learns only that something is listening.
#
# Install this BEFORE the first organizer domain goes live. Ubuntu's packaged
# `sites-enabled/default` already claims `default_server` on :80, and nginx refuses to
# start with two — `duplicate default server for 0.0.0.0:80`.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # Certbot has to be answerable even for a hostname no vhost claims yet: that is exactly
  # the state a domain is in between the DNS record and its first certificate. Without
  # this, issuing the first certificate for a new organizer domain requires editing this
  # file, and an operator in a hurry edits it by disabling the catch-all.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 444;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;

  # Refuse the TLS handshake outright rather than presenting some other customer's
  # certificate to a hostname it was not issued for. Requires nginx 1.19.4 or newer;
  # Ubuntu 24.04 ships 1.24, so this is available.
  #
  # No `http2` parameter here on purpose. It is a per-socket option, and booking.conf
  # already sets it for :443 — declaring it twice makes nginx warn `protocol options
  # redefined` on every reload.
  ssl_reject_handshake on;

  return 444;
}
