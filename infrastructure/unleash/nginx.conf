upstream sf_unleash {
  server 127.0.0.1:4242;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name unleash.shapeandflow.de;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name unleash.shapeandflow.de;

  ssl_certificate     /etc/letsencrypt/live/unleash.shapeandflow.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unleash.shapeandflow.de/privkey.pem;

  client_max_body_size 2m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
    proxy_pass http://sf_unleash;
  }
}

